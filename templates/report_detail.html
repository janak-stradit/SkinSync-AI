<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Report - SkinSync AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%22.9em%22 font-size=%2222%22>🩺</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="app-header-inner">
            <a href="/" class="brand" style="text-decoration:none;">
                <span class="brand-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C12 2 5 8.5 5 14a7 7 0 0 0 14 0c0-5.5-7-12-7-12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M12 6.5C12 6.5 8.5 10.5 8.5 14a3.5 3.5 0 0 0 7 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="brand-name">SkinSync <span class="brand-accent">AI</span></span>
            </a>
            <div class="header-actions">
                <span class="header-badge">Assessment Report</span>
            </div>
        </div>
    </header>

    <div class="toast-stack" id="toast-stack"></div>

    <main class="report-page-main">
        <a href="/" class="report-page-back">&larr; Back to Assessment Portal</a>
        <div class="report-page-card">
            <div id="report-page-container">
                <div class="report-page-state">
                    <div class="report-page-spinner"></div>
                    <p>Loading report&hellip;</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/report-render.js') }}"></script>
    <script>
        const REPORT_ID = {{ report_id }};
    </script>
    <script src="{{ url_for('static', filename='js/report_detail.js') }}"></script>
</body>
</html>
