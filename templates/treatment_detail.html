<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treatment &amp; Recommendations - SkinSync AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <a href="/" class="brand" style="text-decoration:none;">
                <span class="brand-mark">S</span>
                <span class="brand-name">SkinSync <span class="brand-accent">AI</span></span>
            </a>
            <div class="header-actions"><span class="header-badge">Treatment Plan</span></div>
        </div>
    </header>

    <main class="report-page-main treatment-page-main">
        <a class="report-page-back" href="/reports/{{ report_id }}">&larr; Back to Report</a>
        <div class="report-page-hero">
            <span class="report-page-kicker">Personalized Skin Care</span>
            <h1>Treatment &amp; Recommendations</h1>
            <p>A practical morning, evening, and night routine based on your intake information and photo-derived scores.</p>
        </div>
        <div id="treatment-page-container">
            <div class="report-page-card">
                <div class="report-page-state">
                    <div class="report-page-spinner"></div>
                    <p>Preparing your personalized treatment plan&hellip;</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/report-render.js') }}"></script>
    <script>const REPORT_ID = {{ report_id }};</script>
    <script src="{{ url_for('static', filename='js/treatment_detail.js') }}"></script>
</body>
</html>
